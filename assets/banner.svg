    <rect x="36" y="28" width="10" height="10" rx="1" fill="#34d399" opacity="0.8"/>
    <rect x="48" y="28" width="10" height="10" rx="1" fill="#059669" opacity="0.35"/>
    <rect x="0" y="40" width="10" height="10" rx="1" fill="#34d399" opacity="0.7"/>
    <rect x="12" y="40" width="10" height="10" rx="1" fill="#10b981" opacity="0.5"/>
    <rect x="24" y="40" width="10" height="10" rx="1" fill="#34d399" opacity="0.95"/>
    <rect x="36" y="40" width="10" height="10" rx="1" fill="#10b981" opacity="0.45"/>
    <rect x="48" y="40" width="10" height="10" rx="1" fill="#34d399" opacity="0.75"/>
    <rect x="0" y="52" width="10" height="10" rx="1" fill="#059669" opacity="0.3"/>
    <rect x="12" y="52" width="10" height="10" rx="1" fill="#34d399" opacity="0.8"/>
    <rect x="24" y="52" width="10" height="10" rx="1" fill="#10b981" opacity="0.45"/>
    <rect x="36" y="52" width="10" height="10" rx="1" fill="#34d399" opacity="0.9"/>
    <rect x="48" y="52" width="10" height="10" rx="1" fill="#10b981" opacity="0.5"/>
    <rect x="0" y="64" width="10" height="10" rx="1" fill="#34d399" opacity="0.6"/>
    <rect x="12" y="64" width="10" height="10" rx="1" fill="#059669" opacity="0.35"/>
    <rect x="24" y="64" width="10" height="10" rx="1" fill="#34d399" opacity="0.75"/>
