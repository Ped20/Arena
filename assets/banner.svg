  <!-- Name -->
  <text x="220" y="112" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="1.5" fill="#f0f6fc">PRATHAMESH</text>
  <text x="220" y="148" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="1.5" fill="#f0f6fc">DESHMUKH</text>

  <!-- Animated cursor -->
  <rect x="484" y="110" width="3" height="33" rx="1" fill="#34d399">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Title -->
  <text x="220" y="192" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="url(#accGrad)" letter-spacing="0.5">Research Data Scientist</text>

  <!-- Animated underline -->
  <rect x="220" y="202" width="240" height="4" rx="2" fill="url(#goldGrad)">
    <animate attributeName="width" values="0;240;240;0" dur="4s" repeatCount="indefinite" keyTimes="0;0.25;0.75;1"/>
