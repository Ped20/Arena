<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Prathamesh Deshmukh — Research Data Scientist">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a1622"/>
      <stop offset="0.5" stop-color="#0d1f2a"/>
      <stop offset="1" stop-color="#0a1f18"/>
    </linearGradient>
    <linearGradient id="accGrad" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#34d399"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#fde68a"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(920 150) rotate(90) scale(260)">
      <stop stop-color="#10b981" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pixelGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#34d399" opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Base layers -->
  <rect width="1200" height="300" fill="url(#bgGrad)"/>/>
  <rect width="1200" height="300" fill="url(#pixelGrid)"/>/>
  <rect width="1200" height="300" fill="url(#glowGrad)"/>/>

  <!-- Floating particles -->
  <g>
    <circle cx="180" cy="50" r="2" fill="#34d399" opacity="0.4">
      <animate attributeName="cy" values="50;40;55;50" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.8;0.2;0.4" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320" cy="40" r="1.5" fill="#34d399" opacity="0.3">
      <animate attributeName="cy" values="40;30;45;40" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="260" r="1.8" fill="#fbbf24" opacity="0.3">
      <animate attributeName="cy" values="260;250;265;260" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="270" r="1.5" fill="#34d399" opacity="0.25">
      <animate attributeName="cy" values="270;260;275;270" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="60" r="2" fill="#34d399" opacity="0.3">
      <animate attributeName="cy" values="60;50;65;60" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1150" cy="240" r="1.5" fill="#fbbf24" opacity="0.25">
      <animate attributeName="cy" values="240;230;245;240" dur="5.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Pixel Bar Chart -->
  <g transform="translate(55 160)">
    <line x1="0" y1="0" x2="0" y2="-95" stroke="#1d3846" stroke-width="2"/>
    <line x1="0" y1="0" x2="130" y2="0" stroke="#1d3846" stroke-width="2"/>
    <rect x="8" y="0" width="16" fill="#34d399" opacity="0.9" rx="1">
      <animate attributeName="y" values="-95;0;-95" dur="2s" repeatCount="indefinite" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.34 1.56 0.64 1;0.34 0.4 0.64 1"/>
      <animate attributeName="height" values="95;0;95" dur="2s" repeatCount="indefinite" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.34 1.56 0.64 1;0.34 0.4 0.64 1"/>
    </rect>
    <rect x="8" y="-90" width="16" height="10" fill="#10b981" rx="1" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="1.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="32" y="0" width="16" fill="#34d399" opacity="0.85" rx="1">
      <animate attributeName="y" values="-65;0;-65" dur="2s" begin="0.3s" repeatCount="indefinite" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.34 1.56 0.64 1;0.34 0.4 0.64 1"/>
      <animate attributeName="height" values="65;0;65" dur="2s" begin="0.3s" repeatCount="indefinite" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.34 1.56 0.64 1;0.34 0.4 0.64 1"/>
    </rect>
    <rect x="56" y="0" width="16" fill="#34d399" opacity="0.8" rx="1">
      <animate attributeName="y" values="-45;0;-45" dur="2s" begin="0.6s" repeatCount="indefinite" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.34 1.56 0.64 1;0.34 0.4 0.64 1"/>
      <animate attributeName="height" values="45;0;45" dur="2s" begin="0.6s" repeatCount="indefinite" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.34 1.56 0.64 1;0.34 0.4 0.64 1"/>
    </rect>
    <rect x="80" y="0" width="16" fill="#34d399" opacity="0.9" rx="1">
      <animate attributeName="y" values="-85;0;-85" dur="2s" begin="0.9s" repeatCount="indefinite" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.34 1.56 0.64 1;0.34 0.4 0.64 1"/>
      <animate attributeName="height" values="85;0;85" dur="2s" begin="0.9s" repeatCount="indefinite" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.34 1.56 0.64 1;0.34 0.4 0.64 1"/>
    </rect>
    <rect x="104" y="0" width="16" fill="#34d399" opacity="0.75" rx="1">
      <animate attributeName="y" values="-30;0;-30" dur="2s" begin="1.2s" repeatCount="indefinite" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.34 1.56 0.64 1;0.34 0.4 0.64 1"/>
      <animate attributeName="height" values="30;0;30" dur="2s" begin="1.2s" repeatCount="indefinite" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.34 1.56 0.64 1;0.34 0.4 0.64 1"/>
    </rect>
  </g>

  <!-- Pixel Scatter Plot -->
  <g transform="translate(55 210)">
    <line x1="0" y1="0" x2="130" y2="0" stroke="#1d3846" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="0" y2="50" stroke="#1d3846" stroke-width="1.5"/>
    <line x1="0" y1="25" x2="130" y2="25" stroke="#1d3846" stroke-width="0.5" opacity="0.4"/>
    <line x1="65" y1="0" x2="65" y2="50" stroke="#1d3846" stroke-width="0.5" opacity="0.4"/>
    <rect x="10" y="10" width="4" height="4" fill="#34d399" rx="0.5">
      <animate attributeName="x" values="10;12;9;10" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="10;8;11;10" dur="3.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="30" y="25" width="4" height="4" fill="#34d399" rx="0.5">
