    <polyline points="15,75 35,70 55,60 75,65 95,45 115,30 135,35 155,20 168,15" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
      <animate attributeName="stroke-dasharray" values="0,400;400,0" dur="2s" fill="freeze"/>
      <animate attributeName="stroke-dashoffset" values="400;0" dur="2s" fill="freeze"/>
    </polyline>
    <circle cx="35" cy="70" r="2.5" fill="#34d399">
      <animate attributeName="r" values="0;2.5" dur="2s" begin="0.4s" fill="freeze"/>
      <animate attributeName="opacity" values="1;0.5;1" dur="1.5s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="75" cy="65" r="2.5" fill="#34d399">
      <animate attributeName="r" values="0;2.5" dur="2s" begin="0.8s" fill="freeze"/>
    </circle>
    <circle cx="115" cy="30" r="2.5" fill="#fbbf24">
      <animate attributeName="r" values="0;2.5" dur="2s" begin="1.2s" fill="freeze"/>
    </circle>
    <circle cx="155" cy="20" r="2.5" fill="#34d399">
      <animate attributeName="r" values="0;2.5" dur="2s" begin="1.6s" fill="freeze"/>
    </circle>
    <text x="120" y="72" font-family="monospace" font-size="7" fill="#fbbf24" opacity="0.7">R² = 0.89</text>
  </g>

  <!-- Stats Cards -->
  <g transform="translate(800 185)">
    <rect x="0" y="0" width="56" height="74" rx="4" fill="#0d1f2a" stroke="#1d3846" stroke-width="0.8"/>
    <text x="8" y="14" font-family="monospace" font-size="7" fill="#8b949e">p-val</text>
    <text x="8" y="38" font-family="monospace" font-size="18" font-weight="700" fill="#34d399">0.03</text>
    <text x="8" y="54" font-family="monospace" font-size="7" fill="#8b949e">significant</text>
    <rect x="62" y="0" width="56" height="74" rx="4" fill="#0d1f2a" stroke="#1d3846" stroke-width="0.8"/>
    <text x="70" y="14" font-family="monospace" font-size="7" fill="#8b949e">CV%</text>
    <text x="70" y="38" font-family="monospace" font-size="18" font-weight="700" fill="#fbbf24">12.4</text>
    <text x="70" y="54" font-family="monospace" font-size="7" fill="#8b949e">low var</text>
    <rect x="124" y="0" width="56" height="74" rx="4" fill="#0d1f2a" stroke="#1d3846" stroke-width="0.8"/>
    <text x="132" y="14" font-family="monospace" font-size="7" fill="#8b949e">N</text>
    <text x="132" y="38" font-family="monospace" font-size="18" font-weight="700" fill="#34d399">100</text>
    <text x="132" y="54" font-family="monospace" font-size="7" fill="#8b949e">genotypes</text>
  </g>

