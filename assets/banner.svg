    <rect x="0" y="0" width="180" height="100" rx="6" fill="#0d1f2a" stroke="#1d3846" stroke-width="1" opacity="0.8"/>
    <text x="12" y="18" font-family="monospace" font-size="8" fill="#8b949e"># data/scores.csv</text>
    <line x1="15" y1="82" x2="168" y2="82" stroke="#1d3846" stroke-width="1"/>
