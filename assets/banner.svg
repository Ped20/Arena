    <rect x="36" y="0" width="6" height="6" rx="1" fill="#34d399" opacity="0.25">
      <animate attributeName="opacity" values="0.25;0.7;0.25" dur="2.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="48" y="0" width="6" height="6" rx="1" fill="#34d399" opacity="0.35">
      <animate attributeName="opacity" values="0.35;0.75;0.35" dur="1.9s" repeatCount="indefinite"/>
    </rect>
  </g>

