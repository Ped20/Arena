      <animate attributeName="y" values="5;3;6;5" dur="4.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="75" y="35" width="4" height="4" fill="#34d399" rx="0.5">
      <animate attributeName="x" values="75;77;74;75" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="35;33;36;35" dur="3.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="100" y="18" width="4" height="4" fill="#34d399" rx="0.5">
      <animate attributeName="x" values="100;102;99;100" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="18;16;19;18" dur="4.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="118" y="40" width="4" height="4" fill="#fbbf24" rx="0.5">
      <animate attributeName="x" values="118;120;117;118" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="40;38;41;40" dur="3.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Pixel Matrix Rain -->
  <g opacity="0.15">
    <text x="1020" y="0" font-family="monospace" font-size="10" fill="#34d399">1<animate attributeName="y" values="0;300" dur="8s" repeatCount="indefinite"/></text>
    <text x="1040" y="-30" font-family="monospace" font-size="10" fill="#34d399">0<animate attributeName="y" values="-30;270" dur="9s" repeatCount="indefinite"/></text>
    <text x="1060" y="-60" font-family="monospace" font-size="10" fill="#34d399">1<animate attributeName="y" values="-60;240" dur="7s" repeatCount="indefinite"/></text>
    <text x="1080" y="-15" font-family="monospace" font-size="10" fill="#34d399">0<animate attributeName="y" values="-15;285" dur="11s" repeatCount="indefinite"/></text>
    <text x="1100" y="-45" font-family="monospace" font-size="10" fill="#34d399">1<animate attributeName="y" values="-45;255" dur="8.5s" repeatCount="indefinite"/></text>
    <text x="1120" y="-10" font-family="monospace" font-size="10" fill="#34d399">0<animate attributeName="y" values="-10;290" dur="10s" repeatCount="indefinite"/></text>
    <text x="1140" y="-50" font-family="monospace" font-size="10" fill="#34d399">1<animate attributeName="y" values="-50;250" dur="9.5s" repeatCount="indefinite"/></text>
    <text x="1160" y="-20" font-family="monospace" font-size="10" fill="#34d399">0<animate attributeName="y" values="-20;280" dur="7.5s" repeatCount="indefinite"/></text>
  </g>

  <!-- Logo Mark -->
  <g transform="translate(60 65)">
    <rect x="0" y="32" width="8" height="32" rx="1" fill="#34d399" opacity="0.5"/>
    <rect x="12" y="18" width="8" height="46" rx="1" fill="#34d399" opacity="0.78"/>
    <rect x="24" y="4" width="8" height="60" rx="1" fill="#34d399"/>
    <rect x="36" y="25" width="8" height="39" rx="1" fill="#34d399" opacity="0.65"/>
    <rect x="48" y="10" width="8" height="54" rx="1" fill="#34d399" opacity="0.9"/>
