    <rect x="12" y="16" width="10" height="10" rx="1" fill="#10b981" opacity="0.4"/>
    <rect x="24" y="16" width="10" height="10" rx="1" fill="#34d399" opacity="0.7"/>
    <rect x="36" y="16" width="10" height="10" rx="1" fill="#059669" opacity="0.3"/>
    <rect x="48" y="16" width="10" height="10" rx="1" fill="#34d399" opacity="0.6"/>
    <rect x="0" y="28" width="10" height="10" rx="1" fill="#10b981" opacity="0.4"/>
